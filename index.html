<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1eee6">
  <meta name="description" content="Un espace de dessin partagé : les tracés deviennent des particules et prennent vie. Le Squiggle du Vivant •°.">
  <title>Le Squiggle du Vivant •°</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./src/style.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <canvas id="art" aria-label="Espace de dessin du Squiggle du Vivant. Dessinez au doigt, au stylet ou à la souris."></canvas>

  <header>
    <h1>Le Squiggle du Vivant •°</h1>
    <p>Des pigments, des nuages, des formes à imaginer.</p>
  </header>

  <div id="status" aria-hidden="true"></div>

  <footer>
    <div id="invitation" aria-live="polite">
      Déposez une couleur. Laissez émerger ce que vous y voyez.
    </div>

    <div class="controls" role="group" aria-label="Participation">
      <button id="patient" class="active" type="button" aria-pressed="true">Patient</button>
      <button id="psy" type="button" aria-pressed="false">Psychologue</button>
      <button id="observe" type="button" aria-pressed="false">Observer</button>
    </div>

    <div class="pigment-palette">
      <label for="palette">Harmonie</label>
      <select id="palette" aria-label="Harmonie de couleurs">
        <option value="0">Nébuleuse</option>
        <option value="1">Terres vivantes</option>
        <option value="2">Marées</option>
      </select>
      <div id="swatches" role="group" aria-label="Couleur du pigment"></div>
      <button id="mirror" type="button" aria-pressed="false" title="Déposer le geste des deux côtés ; les pigments évoluent ensuite librement">Miroir</button>
    </div>

    <div class="settings">
      <label for="memory">
        Mémoire
        <input id="memory" type="range" min="0" max="100" value="38">
      </label>
      <label for="wild">
        Sauvagerie
        <input id="wild" type="range" min="0" max="100" value="62">
      </label>
      <label for="pigment">
        Pigment
        <input id="pigment" type="range" min="10" max="100" value="70">
      </label>
      <label for="diffusion">
        Diffusion
        <input id="diffusion" type="range" min="0" max="100" value="55">
      </label>
    </div>

    <div class="controls" role="group" aria-label="Œuvre">
      <button id="pause" type="button" aria-pressed="false">Pause</button>
      <button id="save" type="button">Enregistrer</button>
      <button id="reset" type="button">Nouvelle œuvre</button>
    </div>

    <div id="help">Des formes à imaginer, sans interprétation automatique.</div>
  </footer>

  <noscript>Activez JavaScript pour dessiner et laisser les formes prendre vie.</noscript>
</body>
</html>
